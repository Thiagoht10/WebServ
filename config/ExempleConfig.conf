server {
    listen 127.0.0.1:8080;
    listen 127.0.0.1:8081;

    # Limite do corpo em bytes: 1 MiB.
    client_max_body_size 1048576;

    error_page 404 /var/www/errors/404.html;
    error_page 413 /var/www/errors/413.html;
    error_page 500 /var/www/errors/500.html;

    location / {
        root /var/www/html;
        allowed_methods GET;
        directory_listing off;
        index index.html;
        upload_enabled off;
    }

    location /uploads {
        root /var/www/uploads;
        allowed_methods GET POST DELETE;
        directory_listing on;

        upload_enabled on;
        upload_directory /var/www/uploads;
    }

    location /cgi-bin {
        root /var/www/cgi-bin;
        allowed_methods GET POST;
        directory_listing off;
        upload_enabled off;

        cgi_interpreter .py /usr/bin/python3;
        cgi_interpreter .php /usr/bin/php-cgi;
    }

    location /antigo {
        allowed_methods GET;
        return 301 /;
    }
}